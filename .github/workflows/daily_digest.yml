name: Daily Digest

on:
  schedule:
    # Runs at 05:15 UTC every day = 07:15 Zurich time (CEST, UTC+2).
    # Note: Switzerland reverts to CET (UTC+1) in late October, which will
    # shift the delivery time to 06:15 local until this line is updated.
    - cron: "15 5 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run daily digest script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python daily_digest.py
